<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0a0c0d">
  <meta name="description" content="جنگ حلقه: کمپین نوبتی نبرد برای سرزمین میانه، الهام‌گرفته از حالت War of the Ring">
  <title>جنگ حلقه — نبرد سرزمین میانه</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230a0c0d'/><circle cx='32' cy='32' r='20' fill='none' stroke='%23d7b15a' stroke-width='4'/><path d='M32 16v32M16 32h32' stroke='%23d7b15a' stroke-width='2'/></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="intro-open">
  <div id="app" class="app">
    <div class="map-shell" id="mapShell">
      <div id="map" class="map" aria-label="نقشه سرزمین میانه"></div>
      <div class="map-vignette"></div>

      <header id="hud" class="hud is-hidden">
        <div class="hud-brand">
          <span id="playerCrest" class="crest small"></span>
          <span class="hud-brand-text">
            <b id="playerFaction">مردمان آزاد</b>
            <small id="hudGoal">هدف: کنترل ۲۱ سرزمین</small>
          </span>
        </div>
        <div class="hud-stats">
          <div class="hud-stat" title="شماره نوبت">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10M7 21h10M8 3c0 5 8 6 8 9s-8 4-8 9M16 3c0 5-8 6-8 9s8 4 8 9"/></svg>
            <span class="hud-stat-label">نوبت</span>
            <b id="statTurn">۱</b>
          </div>
          <div class="hud-stat gold" title="طلا و درآمد هر نوبت">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 7v10M9 9.5h4.2a2 2 0 0 1 0 4H9M9 13.5h4.8"/></svg>
            <span class="hud-stat-label">طلا</span>
            <b id="statGold">۱۲</b>
            <i id="statIncome">+۰</i>
          </div>
          <div class="hud-stat" title="سرزمین‌های تحت کنترل">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4m0 1h12l-2.5 4L17 13H5"/></svg>
            <span class="hud-stat-label">سرزمین</span>
            <b id="statRegions">۰ / ۲۱</b>
          </div>
        </div>
        <div class="hud-actions">
          <button id="btnSound" class="icon-btn" type="button" title="صدا" aria-label="صدا">
            <svg class="ico-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8 8 0 0 1 0 12"/></svg>
            <svg class="ico-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9l5 6M21 9l-5 6"/></svg>
          </button>
          <button id="btnHelp" class="icon-btn" type="button" title="راهنما" aria-label="راهنمای بازی">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.4 2.3c-.9.4-1.4 1-1.4 2.2M12 17h.01"/></svg>
          </button>
          <button id="btnEnd" class="btn-end" type="button">
            <span>پایان نوبت</span>
            <small id="endSub">نوبت تاریکی</small>
          </button>
        </div>
      </header>

      <div class="map-controls is-hidden" id="mapControls">
        <button id="zoomIn" type="button" aria-label="بزرگ‌نمایی" title="بزرگ‌نمایی">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5M8.5 11h5M11 8.5v5"/></svg>
        </button>
        <button id="zoomOut" type="button" aria-label="کوچک‌نمایی" title="کوچک‌نمایی">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5M8.5 11h5"/></svg>
        </button>
        <button id="zoomFit" type="button" aria-label="نمای کامل نقشه" title="نمای کامل">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
      </div>

      <aside id="panel" class="panel is-hidden" aria-live="polite"></aside>

      <div id="toasts" class="toasts" aria-live="polite"></div>

      <div id="turnBanner" class="turn-banner" aria-hidden="true">
        <span></span>
      </div>
    </div>

    <div id="intro" class="intro">
      <div class="intro-glow"></div>
      <div class="intro-mark" aria-hidden="true">
        <svg viewBox="0 0 600 600">
          <circle cx="300" cy="300" r="252" class="mark-ring"/>
          <circle cx="300" cy="300" r="252" class="mark-ticks"/>
          <circle cx="300" cy="300" r="196" class="mark-ring dotted"/>
          <circle cx="300" cy="300" r="150" class="mark-ring faint"/>
          <circle cx="300" cy="300" r="58" class="mark-ring faint"/>
          <path d="M300 288 L312 300 L300 312 L288 300 Z" class="mark-core"/>
        </svg>
      </div>
      <div class="intro-content">
        <div class="intro-eyebrow">نبرد برای سرزمین میانه</div>
        <h1 class="intro-title">جنگ حلقه</h1>
        <p class="intro-sub">کمپین نوبتی، نقشه زنده و نبردهای تاکتیکی — لمسی برای موبایل و تبلت</p>

        <div class="side-picker" role="group" aria-label="انتخاب سپاه">
          <button class="side-card" type="button" data-side="free">
            <span class="crest" data-crest="free"></span>
            <span class="side-card-name">مردمان آزاد</span>
            <span class="side-card-desc">گندور، روهان، الف‌ها و دورف‌ها در برابر سایه متحد شوید.</span>
            <span class="side-card-tag">۱۶ سرزمین · پایتخت: میناس تیریث</span>
          </button>
          <button class="side-card" type="button" data-side="dark">
            <span class="crest" data-crest="dark"></span>
            <span class="side-card-name">نیروهای تاریکی</span>
            <span class="side-card-desc">لشکرهای موردور، آیزنگارد و شرق را برای فتح غرب رهبری کنید.</span>
            <span class="side-card-tag">۱۶ سرزمین · پایتخت: گورگوروت</span>
          </button>
        </div>

        <button id="btnStart" class="btn-start" type="button" aria-label="Start">آغاز نبرد</button>
        <button id="btnContinue" class="btn-continue is-hidden" type="button">ادامه کمپین ذخیره‌شده</button>

        <div class="intro-meta">
          <button id="btnIntroHelp" class="link-btn" type="button">راهنمای بازی</button>
          <span class="dot">•</span>
          <span>هدف: کنترل ۲۱ سرزمین یا تصرف پایتخت دشمن</span>
        </div>
        <p class="intro-note">هر نوبت یک بار حرکت کنید، پادگان بسازید و ارتش دشمن را از سرزمین‌های مجاور عقب برانید.</p>
      </div>
    </div>

    <div id="battleLayer" class="modal-layer is-hidden" role="dialog" aria-modal="true" aria-label="نبرد"></div>
    <div id="dialogLayer" class="modal-layer is-hidden" role="dialog" aria-modal="true"></div>
    <div id="endLayer" class="modal-layer is-hidden" role="dialog" aria-modal="true"></div>
  </div>

  <noscript>برای اجرای بازی جاوااسکریپت را فعال کنید.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
